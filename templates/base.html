<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Legal Document Generator{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link
      href="{{ url_for('static', filename='css/styles.css') }}"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('legal_document_css') }}" />
    <style>
      :root {
        --primary-color: #ffd700;
        --secondary-color: #b8860b;
        --dark-bg: #1a1a1a;
        --darker-bg: #141414;
        --text-color: #ffffff;
        --border-color: #333333;
      }

      body {
        background-color: var(--dark-bg);
        color: var(--text-color);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .navbar {
        background-color: var(--darker-bg);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 0;
      }

      .navbar-brand {
        color: var(--primary-color) !important;
        font-weight: 700;
        font-size: 1.4rem;
      }

      .navbar-toggler {
        border-color: var(--border-color);
        color: var(--text-color);
      }

      .navbar-toggler-icon {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 215, 0, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
      }

      .nav-link {
        color: var(--text-color) !important;
        transition: color 0.3s ease;
        font-size: 1.1rem;
        padding: 0.5rem 1rem;
        margin: 0 0.2rem;
      }

      .nav-link:hover {
        color: var(--primary-color) !important;
      }

      .nav-link.active {
        color: var(--primary-color) !important;
        border-bottom: 2px solid var(--primary-color);
      }

      .navbar > .container {
        margin-top: 0;
        margin-bottom: 0;
      }

      .container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        flex: 1;
      }

      .card {
        background-color: var(--darker-bg);
        border: 1px solid var(--border-color);
        border-radius: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        padding: 2rem;
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--primary-color);
      }

      .header h1 {
        color: var(--primary-color);
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: #888;
        font-size: 1.1rem;
      }

      .form-control,
      .form-select {
        background-color: #2a2a2a;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        transition: all 0.3s ease;
      }

      .form-control:focus,
      .form-select:focus {
        background-color: #2a2a2a;
        border-color: var(--primary-color);
        color: var(--text-color);
        box-shadow: 0 0 0 0.2rem rgba(255, 215, 0, 0.25);
      }

      .form-label {
        color: var(--primary-color);
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .btn-primary {
        background-color: var(--primary-color);
        border: none;
        color: var(--dark-bg);
        padding: 0.75rem 2rem;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-primary:hover {
        background-color: var(--secondary-color);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .btn-secondary {
        background-color: #2a2a2a;
        border: 1px solid var(--border-color);
        color: var(--text-color);
      }

      .btn-secondary:hover {
        background-color: #333;
        border-color: var(--primary-color);
        color: var(--primary-color);
      }

      footer {
        background-color: var(--darker-bg);
        color: #888;
        padding: 1rem 0;
        text-align: center;
        border-top: 1px solid var(--border-color);
      }

      @media (max-width: 768px) {
        .container {
          margin: 1rem auto;
        }

        .card {
          padding: 1.5rem;
        }

        .header h1 {
          font-size: 2rem;
        }

        .navbar-collapse {
          background-color: var(--darker-bg);
          padding: 1rem;
          border-radius: 8px;
          margin-top: 1rem;
          border: 1px solid var(--border-color);
        }

        .nav-link {
          padding: 0.75rem 1rem;
          border-radius: 4px;
        }

        .nav-link:hover {
          background-color: rgba(255, 215, 0, 0.1);
        }
      }
    </style>
    {% block styles %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-gavel me-2"></i>
          Legal Document Generator
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                href="/"
                aria-current="{% if request.endpoint == 'home' %}page{% endif %}"
              >
                <i class="fas fa-home me-1"></i>
                Home
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'history' %}active{% endif %}"
                href="/history"
                aria-current="{% if request.endpoint == 'history' %}page{% endif %}"
              >
                <i class="fas fa-history me-1"></i>
                History
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
      <div class="container">
        <p class="mb-0">
          &copy; 2024 Legal Document Generator. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
